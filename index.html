<!-- @dsCard group="Pages" name="Landing page" subtitle="Hero + collage + scroll reveal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RODEO — Your (non-class) life, wrangled.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f2eee1;
    --ink: #141414;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: #000;
    font-family: "Bricolage Grotesque", sans-serif;
    font-variation-settings: "opsz" 14, "wdth" 100;
    overflow-x: hidden;
  }

  img { display: block; }

  /* ---------- Hero: left rail (brand, tagline, App Store, footer), collage right ---------- */

  .hero {
    display: flex;
    height: 100vh;
  }

  .hero-left {
    width: 43%;
    min-width: 340px;
    padding: clamp(24px, 3.2vw, 52px);
    display: flex;
    flex-direction: column;
  }

  .brand {
    width: clamp(110px, 9vw, 150px);
    animation: rise-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .brand img { width: 100%; height: auto; }

  .pitch {
    margin-top: 16vh;
    animation: rise-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
  }

  .tagline {
    font-size: clamp(34px, 3.7vw, 74px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 1.15;
  }

  .appstore {
    display: inline-block;
    margin-top: clamp(20px, 2.5vw, 36px);
    width: clamp(150px, 12vw, 180px);
  }
  .appstore img { width: 100%; height: auto; }

  .site-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 15px;
  }
  .site-footer a { color: #000; text-decoration: none; }
  .site-footer a:hover { text-decoration: underline; }
  .foot-icon img { width: 22px; height: 22px; display: block; }
  .site-footer .dot { opacity: 0.6; }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Collage: 1750x1500 stage cover-fills the right side ---------- */
  /* Intentionally cropped at the right/bottom edges, like the reference layout. */

  .collage {
    flex: 1;
    min-width: 0;
    position: relative;
    overflow: hidden;
  }

  .stage-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1750px;
    height: 1500px;
    transform-origin: top left;
    overflow: hidden;
    background: var(--cream);
  }

  .stage .sq {
    position: absolute;
    width: 250px;
    height: 250px;
    background: var(--ink);
  }

  .stage .num {
    position: absolute;
    font-size: 110px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
    white-space: nowrap;
  }
  .stage .num.light { color: var(--cream); }

  .ph {
    position: absolute;
    overflow: hidden;
  }
  .ph img {
    position: absolute;
    max-width: none;
  }
  .ph img.cover {
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .flip {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    transform: scaleX(-1);
  }

  /* Square photos fade in */
  .fade-in {
    opacity: 0;
    transition: opacity 0.9s ease var(--d, 0s);
  }

  /* Cutout / non-square photos slide into the frame */
  .slide-in {
    opacity: 0;
    transform: translate(var(--dx, 0px), var(--dy, 0px));
    transition:
      transform 1.1s cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0s),
      opacity 0.7s ease var(--d, 0s);
  }

  .collage.in .fade-in { opacity: 1; }
  .collage.in .slide-in { opacity: 1; transform: none; }

  /* ---------- Scroll reveal: "tired of scrolling..." ---------- */

  .reveal-zone { height: 450vh; position: relative; }

  .reveal-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    padding: 0 clamp(20px, 5vw, 72px);
    overflow: hidden;
  }

  .reveal-text {
    font-size: clamp(36px, 5.8vw, 75px);
    font-weight: 500;
    letter-spacing: -0.05em;
    line-height: 1.2;
  }

  .line {
    opacity: 0;
    transform: translateY(60px);
    will-change: opacity, transform;
    white-space: nowrap;
  }
  .line.spaced { margin-top: 1.2em; }

  .logo {
    display: inline-block;
    vertical-align: middle;
    margin-left: 0.32em;
    position: relative;
    top: -0.06em;
    opacity: 0;
    transform: scale(0.3) rotate(-25deg);
    will-change: opacity, transform;
  }
  .logo img { width: 100%; height: 100%; }

  .logo.ig       { width: 1.37em; height: 1.37em; }
  .logo.luma     { width: 1.23em; height: 1.24em; }
  .logo.partiful { width: 1.25em; height: 1.36em; }
  .logo.posh     { width: 1.48em; height: 1.48em; }

  /* Partiful squiggle is a region of a larger sprite sheet; crop it the way Figma does */
  .logo.partiful { overflow: hidden; }
  .logo.partiful img {
    position: relative;
    width: 509.4%;
    height: 263.78%;
    left: -82.91%;
    top: -85.83%;
    max-width: none;
  }

  .reveal-tail { height: 18vh; }

  @media (max-width: 820px) {
    .hero { flex-direction: column; height: auto; }
    .hero-left { display: contents; }
    .brand { order: 0; margin: 20px 20px 0; }
    .pitch { order: 1; margin: 28px 20px 32px; }
    .collage { order: 2; flex: none; }
    .stage-wrap { position: relative; inset: auto; }
    .site-footer { order: 3; margin: 24px 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand, .pitch, .fade-in, .slide-in, .line, .logo {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
      animation: none !important;
    }
  }
</style>
<noscript>
  <style>
    .fade-in, .slide-in, .line, .logo { opacity: 1 !important; transform: none !important; }
    .reveal-zone { height: auto; }
    .reveal-sticky { position: static; height: auto; padding-top: 10vh; padding-bottom: 10vh; }
  </style>
</noscript>
</head>
<body>

    <footer class="site-footer">

      <div class="sq" style="left:250px;  top:500px"></div>
      <div class="sq" style="left:750px;  top:500px"></div>
      <div class="sq" style="left:1250px; top:500px"></div>
      <div class="sq" style="left:0;      top:750px"></div>
      <div class="sq" style="left:500px;  top:750px"></div>
      <div class="sq" style="left:1000px; top:750px"></div>
      <div class="sq" style="left:250px;  top:1000px"></div>
      <div class="sq" style="left:750px;  top:1000px"></div>
      <div class="sq" style="left:1250px; top:1000px"></div>
      <div class="sq" style="left:1000px; top:1250px"></div>

      <!-- calendar numbers -->
      <span class="num" style="left:522px;  top:118px">4</span>
      <span class="num" style="left:1022px; top:118px">6</span>
      <span class="num" style="left:1272px; top:368px">14</span>
      <span class="num" style="left:22px;   top:618px">16</span>
      <span class="num" style="left:522px;  top:618px">18</span>
      <span class="num" style="left:1022px; top:618px">20</span>
      <span class="num" style="left:272px;  top:868px">24</span>
      <span class="num" style="left:772px;  top:868px">26</span>
      <span class="num" style="left:1272px; top:868px">28</span>
      <span class="num" style="left:1022px; top:1118px">14</span>
      <span class="num" style="left:772px;  top:1368px">3</span>

      <!-- Espresso-martini pour + cheers (cutout) — slides up from below -->

      </div>

      <span class="num" style="left:522px; top:1118px">26</span>

      <div class="ph fade-in" style="left:250px; top:228px; width:250px; height:272px; --d:0.2s">

      </div>

      <span class="num light" style="left:272px; top:368px">10</span>

      <!-- Tennis court (square) — fades in -->
      <div class="ph fade-in" style="left:1000px; top:750px; width:250px; height:250px; --d:0.3s">

      </div>

      <!-- Picnic (square) — fades in -->
      <div class="ph fade-in" style="left:750px; top:0; width:250px; height:250px; --d:0.4s">

      </div>

      <!-- Low Library Alma Mater (cutout) — slides up from below -->
      <div class="ph slide-in" style="left:1067px; top:1016px; width:433px; height:484px; --dx:0px; --dy:200px; --d:0.65s">

      <!-- Cow-print boots (square) — fades in -->
      <div class="ph fade-in" style="left:0; top:750px; width:250px; height:250px; --d:0.5s">

      <!-- Yellow taxi (cutout, mirrored) — slides in from the right -->
      <div class="ph slide-in" style="left:1250px; top:-218px; width:320px; height:468px; --dx:160px; --dy:0px; --d:0.8s; overflow:visible">

      <div class="ph fade-in" style="left:1250px; top:500px; width:250px; height:250px; --d:0.6s">

      </div>

      <!-- Empire State with moon (cutout) — drops in from the top -->
      <div class="ph slide-in" style="left:1022px; top:139px; width:268px; height:358px; --dx:0px; --dy:-180px; --d:0.95s">
        <img src="assets/empire-moon.png" alt="" style="left:-33.63%; top:0.01%; width:133.58%; height:124.86%" />
      </div>
      </div>
    </div>
  </div>
</section>

<section class="reveal-zone" id="revealZone">
  <div class="reveal-sticky">
    <div class="reveal-text">
      <p class="line" data-line>tired of scrolling...</p>
      <p class="line spaced" data-line>instagram<span class="logo ig"><img src="assets/logo-instagram.png" alt="Instagram logo" /></span></p>
      <p class="line" data-line>luma<span class="logo luma"><img src="assets/logo-luma.png" alt="Luma logo" /></span></p>
      <p class="line" data-line>partiful<span class="logo partiful"><img src="assets/logo-partiful.png" alt="Partiful logo" /></span></p>
      <p class="line" data-line>posh<span class="logo posh"><img src="assets/logo-posh.png" alt="Posh logo" /></span></p>
      <p class="line" data-line>and</p>
      <p class="line" data-line>hundreds of fliers ?</p>
    </div>
  </div>
</section>

<div class="reveal-tail"></div>

<script>
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ----- Scale the 1750x1500 collage stage to fit the viewport ----- */
  const stage = document.getElementById("stage");
  const wrap = document.getElementById("stageWrap");

  function fitStage() {
    const mobile = window.matchMedia("(max-width: 820px)").matches;
    if (mobile) {
      /* fit by width; page scrolls through the full collage */
      const s = wrap.clientWidth / 1750;
      wrap.style.height = 1500 * s + "px";
      stage.style.transform = "scale(" + s + ")";
    } else {
      /* cover the right-side region; crop at the right/bottom edges */
      wrap.style.height = "";
      const s = Math.max(wrap.clientWidth / 1750, wrap.clientHeight / 1500);
      stage.style.transform = "scale(" + s + ")";
    }
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  /* ----- Collage entrance: fade squares, slide cutouts ----- */
  const collage = document.getElementById("collage");
  if (reducedMotion) {
    collage.classList.add("in");
  } else {
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            collage.classList.add("in");
            io.disconnect();
          }
        });
      },
      { threshold: 0.2 }
    );
    io.observe(collage);
  }

  /* ----- Scroll-scrubbed reveal of the "tired of scrolling..." lines ----- */
  const zone = document.getElementById("revealZone");
  const lines = Array.from(document.querySelectorAll("[data-line]"));
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const clamp01 = (v) => Math.min(1, Math.max(0, v));

  function updateReveal() {
    const rect = zone.getBoundingClientRect();
    const vh = window.innerHeight;
    const scrollable = zone.offsetHeight - vh;
    /* start revealing while the zone is still entering the viewport */
    const progress = clamp01((-rect.top + vh * 0.5) / scrollable);

    lines.forEach((line, i) => {
      const start = i * 0.125;
      const t = easeOut(clamp01((progress - start) / 0.18));
      line.style.opacity = t;
      line.style.transform = "translateY(" + (1 - t) * 60 + "px)";

      const logo = line.querySelector(".logo");
      if (logo) {
        const lt = easeOut(clamp01((progress - start - 0.05) / 0.16));
        logo.style.opacity = lt;
        logo.style.transform =
          "scale(" + (0.3 + 0.7 * lt) + ") rotate(" + (1 - lt) * -25 + "deg)";
      }
    });
  }

  if (reducedMotion) {
    lines.forEach((line) => {
      line.style.opacity = 1;
      line.style.transform = "none";
      const logo = line.querySelector(".logo");
      if (logo) {
        logo.style.opacity = 1;
        logo.style.transform = "none";
      }
    });
  } else {
    let ticking = false;
    function onScroll() {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(() => {
          updateReveal();
          ticking = false;
        });
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    updateReveal();
  }
</script>
</body>
</html>
